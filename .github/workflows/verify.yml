name: verify

# 仓库根是 ~/.agents（技能中心），被测的是 skills/harness-bootstrap。
# 为什么每个 job 都带 working-directory：workflow 必须在仓库根才能被 GitHub 读到，
# 而 make check / make lint 的 Makefile 在技能目录里——两头不能只对一头。
#
# 为什么需要 CI：pre-commit 能被 `git commit --no-verify` 绕过，CI 不能。
#
# CI 只做本地做不到的事——不可绕过地跑同一串命令。它不新增断言：
# 目录齐不齐由模板自己的 GATE00x 判，索引对不对由 GUIDE001 判。
# 同一个断言写两处，就有两个地方会漂。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 门禁（技能自审 + 两套模板 + 反向测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/harness-bootstrap
    steps:
      # 取全历史，不是默认的 depth=1：check-all 里的 retro-check 要拿工单的
      # `commit:<sha>` 去 git 历史里核验。浅克隆里查不到旧提交，会被报成
      # 「标 done 却没给可核验证据」——把「历史不全」误报成「工单说谎」，两者
      # 要做的动作相反（补历史 vs 改工单）。实测：CI 连续两次红在这一条，本地全绿。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Python 静态检查是 check-all 的一部分，所以这里必须装 ruff——
      # 装的是 pyproject.toml 里 required-version 声明的区间，版本漂了判定就漂了。
      # 不装会让 make lint-python 报「需要 ruff」并让整个 job 红：缺工具链时
      # 宁可红，也不要静默跳过（跳过 = 这条门禁在 CI 上不存在）。
      - name: 装 ruff
        run: python -m pip install "ruff>=0.17,<0.18"

      # 本 job 故意不装 Go：verify 只做词法检查，不依赖工具链。
      # 「不需要 Go」这句话在这里被真实执行，而不是写在 README 里。
      # 跑 check-all，不是 check + check-strict 两条：本地与 CI 必须是**同一条命令**，
      # 否则「本地绿、CI 红」只是时间问题（Makefile 头注）。
      - name: make check-all
        run: make check-all

  skills:
    name: 跨技能通用子集（frontmatter / 围栏可跑 / 链接 / §引用）
    runs-on: ubuntu-latest
    # 这个 job 的 working-directory 是仓库根：它审的是**所有**技能，不只 harness-bootstrap。
    # 为什么必须进 CI：兄弟技能的破链与跑不起来的围栏不会自己变好，而本地没人会去跑别的技能。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: make audit-skills
        run: make audit-skills

  sample:
    name: 样例 Go 模块
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/harness-bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: skills/harness-bootstrap/templates/go-dev-harness/sample/go.mod

      # 样例模块是「模板声称能编译」的实物证据。不跑它，这句话就会烂掉。
      - name: make check-sample
        run: make check-sample

      # 工具层：需要类型信息的检查（errcheck / unused / errorlint / revive）。
      # 装的是固定版本，和本地跑的是同一个二进制——版本漂了，判定就漂了。
      - name: 装 golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make lint
        run: make lint

      # 证据链行为测试：在临时仓库里跑 make evidence，证明 build/vet/test/race/cover/bench/lint
      # 真能产出 impl.json / test.json，而不是只靠手抄。
      - name: make check-evidence
        run: make check-evidence
