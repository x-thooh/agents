id: empty-bootstrap
title: 空仓库 bootstrap 到可判分交付（阶段 0–4）
description: >-
  空仓库里搭 harness，范围限定阶段 0–4（阶段 5 不做），
  验结构完整、规则-断言配对、入口行数受控、最终给出交付摘要。

input:
  prompt: |
    请按照已安装的 harness-bootstrap 技能（SKILL.md）的流程给当前仓库
    搭建 .harness 工程层（十件套布局）。
    仓库现状：一个几乎空白的仓库，只有 README.md 和 src/hello.py。

    本次范围：只做阶段 0–4，阶段 5（INDEX / discovery 块）不做。
    本评测无人可问，跳过提问式契约阶段，自行采用保守默认契约，
    把决策记入 .harness/memory/decisions.md
    （含被否的替代方案与理由）。

    交付物：
    1. 根 AGENTS.md（入口，只放指针与路由，行数受控）+ .harness 下
       知识/状态/执行三层目录；
    2. verify.py 校验脚本，注册进统一命令入口（Makefile）。
       scope 最多两个（目录覆盖 + 锚点/链接），一个 scope 一个文件，
       verify.py 只做调度；每个上线的 scope 配一个反向样本，
       确认真的会报 ERROR；
    3. 阶段 4 只做一条流程（.harness/workflow/playbooks/<名>.md，
       讲清怎么跑、何时跑、怎么验证装好了）；
    4. 基线：首版 baseline 必须为空（0 条）。当天跑出的 ERROR 要么修掉，
       要么逐条进 accepted 白名单（理由 + 负责人 + 复查日期），
       accepted 只减不增，复查日期过期未续即失效；
    5. 最后必须给出交付摘要作为最终回答：写清盘点结论、做了哪些、
       verify 的结论（如 0 ERROR、扫了多少文件）、哪些没做，
       摘要里要提到 .harness 目录。

    摘要写完即结束，不要继续加固或补做范围外的项。

context:
  repo_fixture: evals/fixtures/repos/bootstrap-target

expect:
  must_contain:
    - ".harness"
  exit_code: 0
  files_exist:
    - "AGENTS.md"
judges:
  - id: skeleton
    type: script
    script_path: evals/fixtures/scripts/check-harness-structure.sh
    timeout_seconds: 120
  - id: discipline
    type: script
    script_path: evals/fixtures/scripts/check-bootstrap-discipline.sh
    timeout_seconds: 120
